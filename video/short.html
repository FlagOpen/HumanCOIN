<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HumanCOIN — 60 seconds</title>
  <meta name="description" content="The one-minute cut of HumanCOIN, a 12,500-hour dataset for human intent in egocentric manipulation.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314202b'/%3E%3Ctext x='16' y='23' font-family='Montserrat,sans-serif' font-size='16' fill='%23fff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="short.css">
</head>
<body>
  <div id="frame">
    <video id="vid" src="HumanCOIN-60s.mp4" preload="metadata" playsinline poster="poster-60.jpg"></video>
    <div id="captions"></div>
    <div id="badge">HumanCOIN · 60 s</div>
    <button id="bigplay" aria-label="Play">▶</button>
  </div>

  <div id="ui">
    <button class="playbtn" id="play" aria-label="Play or pause">▶</button>
    <div id="scrub" aria-label="Seek">
      <div class="rail"></div>
      <div class="fill" id="fill"></div>
      <div class="marks" id="marks"></div>
    </div>
    <div class="time" id="time">0:00 / 1:00</div>
    <button id="cc" style="opacity:.45" aria-label="Captions">CC</button>
    <button id="fs" aria-label="Fullscreen">⛶</button>
  </div>

  <script src="short-data.js"></script>
  <script src="short.js"></script>
</body>
</html>
